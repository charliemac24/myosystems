services:
  myosystems:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myosystems-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
